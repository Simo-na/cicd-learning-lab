
name: My First CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learn-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      
      - name: Verify demo secret is available
        env:
          DEMO_SECRET: ${{ secrets.CI_DEMO_SECRET }}
        shell: bash
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Demo secret is available."
          else
            echo "Demo secret is missing."
            exit 1
          fi


      - name: Show repository files
        run: ls -la

      - name: Verify README exists
        run: test -f README.md

      - name: Display non-sensitive configuration
        env:
          APP_ENV: testing
        run: echo "Application environment is $APP_ENV"

      - name: Confirm success
        run: echo "CI checks passed!"
